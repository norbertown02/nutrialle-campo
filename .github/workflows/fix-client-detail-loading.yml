name: Fix client detail loading

on:
  push:
    paths:
      - '.github/workflows/fix-client-detail-loading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch client detail
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/screens/FichaCliente.jsx')
          s = p.read_text()

          old = """  useEffect(() => {
    if (!farm?.id) return
    let ativo = true
    async function carregarCotacoes() {
      const { data, error } = await supabase
        .from('quotes')
        .select('*')
        .eq('farm_id', farm.id)
        .order('created_at', { ascending: false })
      if (!ativo) return
      if (!error && data) {
        setFarmQuotes(data)
      } else {
        // offline: usa o cache local, igual as outras telas de cotação
        const cached = await db.quotes_cache.where('farm_id').equals(farm.id).toArray()
        if (ativo) setFarmQuotes(cached)
      }
    }
    carregarCotacoes()
    return () => { ativo = false }
  }, [farm?.id])
"""
          new = """  useEffect(() => {
    if (!farm?.id) return
    let ativo = true
    async function carregarCotacoes() {
      // Cache primeiro para a ficha abrir sem esperar a rede.
      const cached = await db.quotes_cache.where('farm_id').equals(farm.id).toArray()
      if (ativo && cached.length) setFarmQuotes(cached.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || ''))))

      const { data, error } = await supabase
        .from('quotes')
        .select('*')
        .eq('farm_id', farm.id)
        .order('created_at', { ascending: false })
      if (!ativo) return
      if (!error && data) {
        setFarmQuotes(data)
        await db.quotes_cache.bulkPut(data)
      } else if (!cached.length) {
        setFarmQuotes([])
      }
    }
    carregarCotacoes()
    return () => { ativo = false }
  }, [farm?.id])
"""
          assert old in s, 'bloco de cotacoes nao encontrado'
          s = s.replace(old, new)

          old = """  if (!farm) {
    return (
      <div className=\"content\">
        <button onClick={() => navigate('/clientes')} style={backBtnStyle}>
          <IconArrowLeft size={16} /> Voltar
        </button>
        <div className=\"empty\" style={{ marginTop: 40 }}>
          <IconUser />
          <p>Fazenda nao encontrada</p>
        </div>
      </div>
    )
  }
"""
          new = """  if (!farm && farmsHook.loading) {
    return (
      <div className=\"content\">
        <div className=\"empty\" style={{ marginTop: 40 }}>
          <IconUser />
          <p>Carregando cliente...</p>
          <small style={{ color: 'var(--text-faint)' }}>Buscando dados salvos e atualizando a ficha</small>
        </div>
      </div>
    )
  }

  if (!farm) {
    return (
      <div className=\"content\">
        <button onClick={() => navigate('/clientes')} style={backBtnStyle}>
          <IconArrowLeft size={16} /> Voltar
        </button>
        <div className=\"empty\" style={{ marginTop: 40 }}>
          <IconUser />
          <p>Fazenda nao encontrada</p>
        </div>
      </div>
    )
  }
"""
          assert old in s, 'bloco farm not found nao encontrado'
          s = s.replace(old, new)

          old = """  async function salvarEdicao() {
    const changes = {
"""
          new = """  async function salvarEdicao() {
    const documento = String(editForm.cpfCnpj || '').replace(/\\D/g, '')
    if (documento.length === 14 && !String(editForm.ie || '').trim()) {
      showToast('A Inscrição Estadual é obrigatória para clientes com CNPJ.', 'error')
      return
    }

    const changes = {
"""
          assert old in s, 'salvarEdicao nao encontrado'
          s = s.replace(old, new)

          p.write_text(s)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/FichaCliente.jsx
          git commit -m "fix: make client detail load fast" || exit 0
          git push
