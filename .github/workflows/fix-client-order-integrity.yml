name: Fix client and order integrity

on:
  push:
    paths:
      - '.github/workflows/fix-client-order-integrity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch client, order and PDF flows
        shell: python
        run: |
          from pathlib import Path

          # ---- CNPJ exige IE ----
          p = Path('src/screens/NovaFazenda.jsx')
          s = p.read_text()
          old = """  const isValid = form.name.trim().length >= 3 && form.owner.trim().length >= 3 &&
    form.city.trim().length >= 2 && (cidadeVerificada || !online) && documentoValido
"""
          new = """  const ieObrigatoriaValida = form.docTipo !== 'cnpj' || form.cnpjIE.trim().length >= 2

  const isValid = form.name.trim().length >= 3 && form.owner.trim().length >= 3 &&
    form.city.trim().length >= 2 && (cidadeVerificada || !online) && documentoValido && ieObrigatoriaValida
"""
          assert old in s, 'isValid NovaFazenda não encontrado'
          s = s.replace(old, new)

          old = """      ) : (
        <Field label=\"CNPJ *\">
          <input value={form.cnpj} onChange={e=>setField('cnpj',maskCNPJ(e.target.value))} placeholder=\"00.000.000/0000-00\" inputMode=\"numeric\"/>
        </Field>
      )}
"""
          new = """      ) : (
        <>
          <Field label=\"CNPJ *\">
            <input value={form.cnpj} onChange={e=>setField('cnpj',maskCNPJ(e.target.value))} placeholder=\"00.000.000/0000-00\" inputMode=\"numeric\"/>
          </Field>
          <Field label=\"Inscrição Estadual (IE) *\">
            <input value={form.cnpjIE||''} onChange={e=>setField('cnpjIE',e.target.value)} placeholder=\"Informe a IE obrigatória para CNPJ\"/>
          </Field>
          {!ieObrigatoriaValida && form.cnpjIE !== '' ? (
            <div className=\"hint\" style={{ marginTop:-6, marginBottom:10, color:'var(--red)' }}>A Inscrição Estadual é obrigatória para clientes com CNPJ.</div>
          ) : null}
        </>
      )}
"""
          assert old in s, 'bloco CNPJ NovaFazenda não encontrado'
          s = s.replace(old, new)
          p.write_text(s)

          # ---- Pedido: validação explícita e sempre KG ----
          p = Path('src/screens/NovaVenda.jsx')
          s = p.read_text()
          s = s.replace("import { useState, useEffect } from 'react'", "import { useState } from 'react'")
          s = s.replace("import { useProducts } from '../lib/useProducts'", "import { useProducts } from '../lib/useProducts'\nimport { showToast } from '../lib/toast'")

          start = s.find("  useEffect(() => {\n    if (!paymentTerms.length) return")
          end_marker = "  const selectedFarm = farmId ? getFarm(farmId) : preselectedFarm\n"
          end = s.find(end_marker)
          assert start >= 0 and end > start, 'useEffects default payment não encontrados'
          s = s[:start] + end_marker + s[end+len(end_marker):]

          old = """  const isValid = farmId && items.length > 0 && !!paymentTermId && !!paymentMethodId && !!tabelaPreco && items.every(it =>
    Number(it.quantity) > 0 && Number(it.priceKg) >= 0
  )

  const handleSave = () => {
    if (!isValid) return
"""
          new = """  const datasValidas = !!saleDate && !!deliveryDate && deliveryDate >= saleDate
  const itensValidos = items.length > 0 && items.every(it =>
    !!it.productId && Number(it.quantity) > 0 && Number(it.priceKg) > 0 && String(it.unit || 'kg').toLowerCase() === 'kg'
  )
  const isValid = !!farmId && !!selectedFarm && datasValidas && itensValidos &&
    !!paymentTermId && !!paymentMethodId && !!tabelaPreco && !!frete

  const handleSave = async () => {
    if (!isValid) {
      showToast('Preencha cliente, datas, produtos em kg, preço/kg, condição e método de pagamento.', 'error')
      return
    }
"""
          assert old in s, 'validação NovaVenda não encontrada'
          s = s.replace(old, new)

          old = """    addSale({
"""
          new = """    const { error } = await addSale({
"""
          s = s.replace(old, new, 1)

          old = """    })

    navigate('/vendas')
  }
"""
          new = """    })

    if (error) {
      showToast('Não foi possível registrar o pedido: ' + (error.message || 'erro desconhecido'), 'error')
      return
    }
    showToast('Pedido registrado com sucesso.', 'success')
    navigate('/vendas')
  }
"""
          assert old in s, 'fim handleSave NovaVenda não encontrado'
          s = s.replace(old, new, 1)

          s = s.replace("{availableProducts.map(p => <option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}", "{availableProducts.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}")
          s = s.replace("<select value={paymentTermId} onChange={e => setPaymentTermId(e.target.value)}>\n          {paymentTerms.map", "<select value={paymentTermId} onChange={e => setPaymentTermId(e.target.value)}>\n          <option value=\"\">Selecionar condição...</option>\n          {paymentTerms.map")
          s = s.replace("<select value={paymentMethodId} onChange={e => setPaymentMethodId(e.target.value)}>\n          {paymentMethods.map", "<select value={paymentMethodId} onChange={e => setPaymentMethodId(e.target.value)}>\n          <option value=\"\">Selecionar método...</option>\n          {paymentMethods.map")
          p.write_text(s)

          # ---- PDF: KG real, nome longo e observação ----
          p = Path('src/screens/DetalheVenda.jsx')
          s = p.read_text()

          old = """    doc.setFontSize(17)
    doc.setTextColor(...TEXT)
    doc.text(cliente, M + 7, y + 18, { maxWidth: 95 })

    doc.setFont('helvetica', 'normal')
    doc.setFontSize(8.4)
    doc.setTextColor(...MUTED)

    const infosCliente = [
"""
          new = """    const clienteLines = doc.splitTextToSize(String(cliente || 'Cliente'), 95).slice(0, 2)
    doc.setFontSize(clienteLines.length > 1 ? 12.5 : 17)
    doc.setTextColor(...TEXT)
    doc.text(clienteLines, M + 7, y + 17)

    doc.setFont('helvetica', 'normal')
    doc.setFontSize(8.4)
    doc.setTextColor(...MUTED)

    const infosCliente = [
"""
          assert old in s, 'nome cliente PDF não encontrado'
          s = s.replace(old, new)
          s = s.replace("doc.text(infosCliente.join('  ·  '), M + 7, y + 26)", "doc.text(infosCliente.join('  ·  '), M + 7, y + 29)")
          s = s.replace("doc.text(docsCliente.length > 0 ? docsCliente.join('  ·  ') : 'Dados cadastrais incompletos', M + 7, y + 33, { maxWidth: 95 })", "doc.text(docsCliente.length > 0 ? docsCliente.join('  ·  ') : 'Dados cadastrais incompletos', M + 7, y + 36, { maxWidth: 95 })")
          s = s.replace("doc.line(W - M - 58, y + 7, W - M - 58, y + 33)", "doc.line(W - M - 58, y + 7, W - M - 58, y + 36)")

          old = """      head: [[
        'Produto',
        'Qtd.',
        'Total kg',
        'R$/kg',
        'R$/saco',
        'Subtotal',
      ]],
      body: itens.map(item => {
        const quantidade = Number(item.quantity || 0)
        const bagKg = Number(item.bagKg || 25)
        const totalKg = quantidade * bagKg
        const valorSaco = Number(item.unitPrice || 0)
        const valorKg = item.priceKg
          ? Number(item.priceKg)
          : bagKg > 0
            ? valorSaco / bagKg
            : 0

        return [
          item.productName || '—',
          quantidade.toLocaleString('pt-BR'),
          `${totalKg.toLocaleString('pt-BR')} kg`,
          moeda(valorKg),
          moeda(valorSaco),
          moeda(item.subtotal),
        ]
      }),
"""
          new = """      head: [[
        'Produto',
        'Quantidade (kg)',
        'R$/kg',
        'Desc. %',
        'Subtotal',
      ]],
      body: itens.map(item => {
        const quantidadeKg = Number(item.quantityKg ?? item.quantity ?? 0)
        const valorKg = Number(item.priceKg ?? item.unitPrice ?? 0)
        const descontoPct = Number(item.discount || 0)

        return [
          item.productName || '—',
          `${quantidadeKg.toLocaleString('pt-BR')} kg`,
          moeda(valorKg),
          descontoPct > 0 ? `${descontoPct.toLocaleString('pt-BR')}%` : '—',
          moeda(item.subtotal),
        ]
      }),
"""
          assert old in s, 'tabela PDF antiga não encontrada'
          s = s.replace(old, new)

          old = """      columnStyles: {
        0: {
          cellWidth: 63,
          halign: 'left',
          fontStyle: 'bold',
        },
        1: {
          cellWidth: 18,
          halign: 'center',
        },
        2: {
          cellWidth: 26,
          halign: 'center',
        },
        3: {
          cellWidth: 25,
          halign: 'right',
        },
        4: {
          cellWidth: 26,
          halign: 'right',
        },
        5: {
          cellWidth: 24,
          halign: 'right',
          fontStyle: 'bold',
          textColor: ORANGE_DARK,
        },
      },
"""
          new = """      columnStyles: {
        0: { cellWidth: 76, halign: 'left', fontStyle: 'bold' },
        1: { cellWidth: 32, halign: 'center' },
        2: { cellWidth: 28, halign: 'right' },
        3: { cellWidth: 20, halign: 'center' },
        4: { cellWidth: 26, halign: 'right', fontStyle: 'bold', textColor: ORANGE_DARK },
      },
"""
          assert old in s, 'columnStyles PDF antigo não encontrado'
          s = s.replace(old, new)

          s = s.replace("Number(item.quantity || 0) * Number(item.unitPrice || 0)", "Number(item.quantityKg ?? item.quantity ?? 0) * Number(item.priceKg ?? item.unitPrice ?? 0)")

          old = """    const condicoes = [
      ['Condição', venda.paymentTermLabel || '—'],
      ['Frete', venda.frete_label || venda.frete || 'CIF - Frete por conta do vendedor'],
      ['Data da venda', emitidaEm],
      ['Registrado em', formatDateTime(venda.createdAt)],
    ]
"""
          new = """    const condicoes = [
      ['Condição', venda.paymentTermLabel || '—'],
      ['Método', venda.paymentMethodLabel || '—'],
      ['Frete', venda.frete_label || venda.frete || '—'],
      ['Data da venda', emitidaEm],
      ['Entrega', formatDate(venda.deliveryDate)],
    ]
"""
          assert old in s, 'condições PDF não encontradas'
          s = s.replace(old, new)

          marker = """    const pageCount = doc.internal.getNumberOfPages()
"""
          notes_block = """    if (venda.notes && String(venda.notes).trim()) {
      y += 57
      const obsLines = doc.splitTextToSize(String(venda.notes).trim(), W - M * 2 - 12)
      const obsHeight = Math.max(24, 14 + obsLines.length * 4.2)
      if (y + obsHeight > H - 24) {
        doc.addPage()
        y = 24
      }
      doc.setFillColor(...WHITE)
      doc.setDrawColor(...LINE)
      doc.roundedRect(M, y, W - M * 2, obsHeight, 4, 4, 'FD')
      doc.setFont('helvetica', 'bold')
      doc.setFontSize(7.8)
      doc.setTextColor(...ORANGE_DARK)
      doc.text('OBSERVAÇÕES DO PEDIDO', M + 6, y + 8)
      doc.setFont('helvetica', 'normal')
      doc.setFontSize(8.5)
      doc.setTextColor(...TEXT)
      doc.text(obsLines, M + 6, y + 16)
    }

"""
          assert marker in s, 'marcador final PDF não encontrado'
          s = s.replace(marker, notes_block + marker)
          p.write_text(s)

      - name: Verify build
        run: npm ci && npm run build

      - name: Commit fixes
        run: |
          git config user.name "Nutrialle Automation"
          git config user.email "automation@nutrialle.com.br"
          git add src/screens/NovaFazenda.jsx src/screens/NovaVenda.jsx src/screens/DetalheVenda.jsx
          git commit -m "fix: enforce client data and kg order flow"
          git push
